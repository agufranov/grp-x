<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ГРП · Схема скважины</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"><link rel="stylesheet" href="charts-extra.css"><link rel="stylesheet" href="simulation.css"><link rel="stylesheet" href="mini-well.css"><link rel="stylesheet" href="cursor-guide.css">
</head>
<body>
  <main>
    <section id="workspace">
      <div id="stickySentinel" aria-hidden="true"></div>
      <div class="well-head" id="wellHead">
          <label>Скважина
            <select id="dataset"><option value="">Выберите скважину…</option><option value="upload">＋ Загрузить XLSX…</option></select>
          </label>
          <label>Испытание
            <select id="select" disabled><option>Сначала выберите скважину</option></select>
          </label>
          <span class="key-hint"><kbd>↑</kbd> предыдущее <kbd>↓</kbd> следующее</span>
          <span class="head-divider" aria-hidden="true"></span>
          <div class="simulation-controls">
            <strong class="simulation-title">Симуляция</strong>
            <label class="sim-port">Активная перфорация<select id="simPort" disabled><option>Сначала выберите скважину</option></select></label>
            <label>Шум <span><input id="simNoise" type="range" min="0" max="100" value="0"><output for="simNoise">0%</output></span></label>
            <label>Скорость <span><input id="simVelocity" type="range" min="1000" max="1800" step="10" value="1450"><output for="simVelocity">1450 м/с</output></span></label>
            <label>Затухание <span><input id="simAttenuation" type="range" min="0" max="100" value="35"><output for="simAttenuation">35%</output></span></label>
            <label>Импульс <span><input id="simPulse" type="range" min="6" max="60" value="18"><output for="simPulse">18 мс</output></span></label>
          </div>
          <svg id="miniWell" class="mini-well" aria-label="Миниатюра скважины"></svg>
      </div>
      <div class="card well-card">
        <div class="scroll"><svg id="diagram" viewBox="0 0 1200 190" aria-label="Схема скважины"><text x="600" y="95" text-anchor="middle" fill="#8da098" font-size="13">Выберите скважину, чтобы построить схему</text></svg></div>
      </div>
      <div class="cepstrum-card empty-chart"><div class="chart-head"><button class="chart-toggle" type="button" aria-expanded="true"><span class="chart-name"><b>Сигнал из данных</b><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></span></button><span id="signalMeta" class="chart-meta"></span></div><div id="signalEmpty" class="chart-empty">Сначала выберите скважину и испытание</div><svg id="signalGraph" aria-label="Сигнал из данных"></svg></div>
      <div class="cepstrum-card empty-chart"><div class="chart-head"><button class="chart-toggle" type="button" aria-expanded="true"><span class="chart-name"><b>Кепстр из данных</b><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></span></button><span class="chart-scale" aria-label="Горизонтальный масштаб" hidden><span class="chart-scale-value"></span><button class="chart-scale-reset" type="button">Сбросить</button></span><span id="chartMeta" class="chart-meta"></span></div><div id="chartEmpty" class="chart-empty">Сначала выберите скважину и испытание</div><svg id="cepstrum" class="cepstrum-scale-target" aria-label="Кепстр из данных" aria-describedby="scaleTooltip"></svg></div>
      <div class="cepstrum-card simulation-chart empty-chart"><div class="chart-head"><button class="chart-toggle" type="button" aria-expanded="true"><span class="chart-name"><b>Сигнал симуляции</b><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></span></button><span id="simSignalMeta" class="chart-meta"></span></div><div id="simSignalEmpty" class="chart-empty">Сначала выберите скважину</div><svg id="simSignal" aria-label="Сигнал симуляции"></svg></div>
      <div class="cepstrum-card simulation-chart empty-chart"><div class="chart-head"><button class="chart-toggle" type="button" aria-expanded="true"><span class="chart-name"><b>Кепстр симуляции</b><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></span></button><span class="chart-scale" aria-label="Горизонтальный масштаб" hidden><span class="chart-scale-value"></span><button class="chart-scale-reset" type="button">Сбросить</button></span><span id="simCepstrumMeta" class="chart-meta"></span></div><div id="simCepstrumEmpty" class="chart-empty">Сначала выберите скважину</div><svg id="simCepstrum" class="cepstrum-scale-target" aria-label="Кепстр синтетического сигнала" aria-describedby="scaleTooltip"></svg></div>
      <div class="cepstrum-card empty-chart"><div class="chart-head computed-chart-head"><button class="chart-toggle" type="button" aria-expanded="true"><span class="chart-name"><b>Рассчитанный кепстр</b><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></span></button><span class="chart-scale" aria-label="Горизонтальный масштаб" hidden><span class="chart-scale-value"></span><button class="chart-scale-reset" type="button">Сбросить</button></span><span id="computedMeta" class="chart-meta"></span><div id="signalFilterControls" class="signal-filter-controls" hidden><strong>Обработка сигнала</strong><label>Время от <span><input id="filterStart" type="range"><output id="filterStartOutput" for="filterStart">—</output></span></label><label>до <span><input id="filterEnd" type="range"><output id="filterEndOutput" for="filterEnd">—</output></span></label><label>Частоты от <span><input id="filterLow" type="range"><output id="filterLowOutput" for="filterLow">—</output></span></label><label>до <span><input id="filterHigh" type="range"><output id="filterHighOutput" for="filterHigh">—</output></span></label><button id="filterAfterStop" type="button">После остановки</button><button id="filterReset" type="button">Сбросить</button></div></div><div id="computedEmpty" class="chart-empty">Сначала выберите скважину и испытание</div><svg id="computedCepstrum" class="cepstrum-scale-target" aria-label="Рассчитанный кепстр" aria-describedby="scaleTooltip"></svg></div>
      <details><summary>Распознанные данные <span id="summary"></span></summary><div class="table"><table><thead><tr><th>№ испытания</th><th>Название</th><th>Порт шара</th><th>Глубина</th></tr></thead><tbody id="rows"></tbody></table></div></details>
    </section>
    <input type="file" id="file" accept=".xlsx,.xls" hidden>
    <div id="cursorGuide" class="cursor-guide" aria-hidden="true"></div>
    <div id="scaleTooltip" class="scale-tooltip" role="tooltip" aria-hidden="true">Изменить масштаб</div>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script src="vendor/xlsx.full.min.js"></script><script src="app.js"></script>
</body>
</html>
